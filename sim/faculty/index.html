const KEY="fw-simf-word";
const form=document.getElementById("gate"),input=document.getElementById("w"),btn=document.getElementById("go"),msg=document.getElementById("m");
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openWith(word){
  const raw=new TextEncoder().encode(word.trim().toLowerCase());
  const base=await crypto.subtle.importKey("raw",raw,"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(LOCK.salt),iterations:LOCK.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCK.iv)},key,b64(LOCK.ct));
  return new TextDecoder().decode(plain);
}
function show(page){ document.open(); document.write(page); document.close(); }
function remember(w){ try{ localStorage.setItem(KEY,w); }catch(e){} }
function recall(){ try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } }
function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} }
if(!(window.crypto&&crypto.subtle)){ msg.className="msg err"; msg.textContent="This browser can't open the page. Try Chrome, Safari or Firefox."; btn.disabled=true; return; }
const saved=recall();
if(saved){ msg.textContent="Opening\u2026"; openWith(saved).then(show).catch(function(){ forget(); msg.textContent=""; }); }
form.addEventListener("submit",function(e){
  e.preventDefault();
  const w=input.value;
  if(!w.trim()){ msg.className="msg err"; msg.textContent="Type the word you were given."; return; }
  btn.disabled=true; msg.className="msg"; msg.textContent="Checking\u2026";
  openWith(w).then(function(page){ remember(w.trim().toLowerCase()); show(page); })
   .catch(function(){ btn.disabled=false; msg.className="msg err"; msg.textContent="That word doesn't open this page. Check the spelling, or ask the faculty."; input.select(); });
});
})();
