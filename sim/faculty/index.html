const KEY="fw-simf-word";
const ALT=null;
const AUTO=true;
const form=document.getElementById("gate"),input=document.getElementById("w"),btn=document.getElementById("go"),msg=document.getElementById("m");
const clean=w=>String(w).toLowerCase().replace(/[^a-z]/g,"");
let busy=false, opened=false;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(L,word){
  const raw=new TextEncoder().encode(clean(word));
  const base=await crypto.subtle.importKey("raw",raw,"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(L.salt),iterations:L.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(L.iv)},key,b64(L.ct)));
}
async function tryAlt(word){
  if(!ALT) return false;
  let ok=false; try{ ok=(await unlock(ALT.lock,word))===ALT.token; }catch(e){ return false; }
  if(!ok) return false;
  try{ localStorage.setItem(ALT.store,clean(word)); }catch(e){}
  opened=true; msg.className="msg"; msg.textContent="Opening the faculty run sheet\u2026";
  location.href=ALT.href; return true;
}
async function openWith(word){ return unlock(LOCK,word); }
function show(page){ if(opened) return; opened=true; document.open(); document.write(page); document.close(); }
function remember(w){ try{ localStorage.setItem(KEY,w); }catch(e){} }
function recall(){ try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } }
function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} }
if(!(window.crypto&&crypto.subtle)){ msg.className="msg err"; msg.textContent="This browser can't open the page. Try Chrome, Safari or Firefox."; btn.disabled=true; return; }
if(!AUTO) forget();
const saved=AUTO?recall():"";
if(saved){ busy=true; input.disabled=true; btn.disabled=true; msg.textContent="Opening\u2026";
  openWith(saved).then(show).catch(function(){ forget(); busy=false; input.disabled=false; btn.disabled=false; msg.textContent=""; input.focus(); }); }
form.addEventListener("submit",function(e){
  e.preventDefault();
  if(busy||opened) return;
  const w=input.value;
  if(!clean(w)){ msg.className="msg err"; msg.textContent="Type the word you were given."; return; }
  busy=true; btn.disabled=true; msg.className="msg"; msg.textContent="Checking\u2026";
  openWith(w).then(function(page){ if(AUTO) remember(clean(w)); show(page); })
   .catch(function(){ return tryAlt(w).then(function(went){ if(!went) throw 0; }); })
   .catch(function(){ busy=false; btn.disabled=false; msg.className="msg err"; msg.textContent="That word doesn't open this page. Check the spelling, or ask the faculty."; input.select(); });
});
})();
