const STORE="fwsn-access";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tb64=u=>btoa(String.fromCharCode(...u));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,"0")).join("");
const norm=s=>s.toUpperCase().replace(/[^0-9A-Z]/g,"");
async function keysFile(){const r=await fetch("keys.json",{cache:"no-store"});if(!r.ok)throw new Error("keys");return r.json();}
async function kidOf(raw){return hex(new Uint8Array(await crypto.subtle.digest("SHA-256",raw))).slice(0,16);}
async function derive(code,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(code)),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(salt),iterations:250000},base,256));}
async function unwrap(raw,entry){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(entry.iv)},k,b64(entry.w)));}
async function openPage(master){
  const k=await crypto.subtle.importKey("raw",master,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAGE.iv)},k,b64(PAGE.ct)));
  document.open();document.write(html);document.close();}
function form(note){
  document.getElementById("box").innerHTML=`<div class="lock">🔒</div><h1>These notes are locked</h1>
  <p>Type the access key Dr Chhabra gave you. You'll only need it once on this device.</p>
  <form id="f"><input id="k" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="FW-XXXX-XXXX-XXXX" aria-label="Access key"><button id="b">Open the notes</button></form>
  <div class="msg" id="m">${note||""}</div>
  <div class="foot">No key yet? Write to Dr Harvinder Singh Chhabra, dr.fmt.hsc@gmail.com, 9814904440.<br>Forensic Workbench · Surgery notes</div>`;
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("b"),m=document.getElementById("m");
    const code=document.getElementById("k").value;if(norm(code).length<10){m.textContent="That key looks too short. Check it and try again.";return;}
    b.disabled=true;b.textContent="Checking…";m.textContent="";
    try{const K=await keysFile();const raw=await derive(code,K.salt);const kid=await kidOf(raw);const entry=K.keys.find(x=>x.kid===kid);
      if(!entry){m.textContent="That key doesn't match. Check each character and try again.";b.disabled=false;b.textContent="Open the notes";return;}
      const master=await unwrap(raw,entry);try{localStorage.setItem(STORE,JSON.stringify({kid,k:tb64(raw)}));}catch(_){}
      await openPage(master);
    }catch(err){m.textContent="Couldn't reach the key list. Check your internet connection.";b.disabled=false;b.textContent="Open the notes";}};}
(async()=>{
  if(!window.crypto||!crypto.subtle){form("This browser can't open locked pages. Try an up-to-date Chrome, Edge, Firefox or Safari.");return;}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||"null");}catch(_){}
  if(!saved){form();return;}
  try{const K=await keysFile();const entry=K.keys.find(x=>x.kid===saved.kid);
    if(!entry){try{localStorage.removeItem(STORE);}catch(_){}form("The key saved on this device is no longer active. Ask Dr Chhabra for a new one.");return;}
    await openPage(await unwrap(b64(saved.k),entry));
  }catch(err){form("Couldn't reach the key list. Check your internet connection.");}
})();
